name: Build Android & iOS

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  # ============================================
  # ANDROID BUILD (Linux runner — bepul, tez)
  # ============================================
  build-android:
    name: Android APK Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create platform folders
        run: flutter create . --org com.mnsm --project-name arab_mentor --platforms=android,ios

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arab-mentor-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build App Bundle (for Play Store)
        run: flutter build appbundle --release

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: arab-mentor-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ============================================
  # iOS BUILD (macOS runner — Apple talab qiladi)
  # ============================================
  build-ios:
    name: iOS Build (unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create platform folders
        run: flutter create . --org com.mnsm --project-name arab_mentor --platforms=android,ios

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package iOS app as IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r arab-mentor-ios-unsigned.ipa Payload
          mv arab-mentor-ios-unsigned.ipa ../../../

      - name: Upload iOS IPA (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: arab-mentor-ios-ipa
          path: arab-mentor-ios-unsigned.ipa
          retention-days: 30
